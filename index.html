<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wahd l word sghir ajemmi</title> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- Lien l biblio( ajax) dyal dok l icons -->
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
      }
      
      .editor-container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        overflow: hidden;
      }
      
      .toolbar {
        background: #f0f0f0;
        padding: 10px;
        border-bottom: 1px solid #ddd;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      
      .toolbar button, 
      .toolbar select {
        padding: 8px 12px;
        border: 1px solid #ccc;
        background: white;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        font-size: 14px;
      }
      
      .toolbar button:hover, 
      .toolbar select:hover {
        background: #e9e9e9;
      }
      
      .toolbar button i {
        margin-right: 5px;
      }
      
      #textColor {
        height: 35px;
        width: 40px;
        padding: 0 !important;
        border: 1px solid #ccc !important;
      }
      
      .page {
        display: none;
        min-height: 400px;
        padding: 20px;
      }
      
      .page.active {
        display: block;
      }
      
      .editor {
        outline: none;
        min-height: 400px;
        line-height: 1.5;
      }
      
      /* Styles ldok les images li dekhl wla khtarhom l user*/
      .editor img {
        max-width: 100%;
        height: auto;
        margin: 10px 0;
        display: block;
        border-radius: 4px;
      }
      
      /* Styles l video containers */
      .editor .video-container {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
        margin: 15px 0;
        background: #000;
        border-radius: 4px;
      }
      
      .editor .video-container iframe,
      .editor .video-container video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
      
      /* Styles ll audio player */
      .editor audio {
        width: 100%;
        margin: 15px 0;
        min-width: 250px;
      }
      
      .file-options {
        margin-top: 10px;
        padding: 10px;
        background: #f0f0f0;
        display: flex;
        gap: 10px;
        border-top: 1px solid #ddd;
      }
      
      .page-tabs {
        display: flex;
        background: #e0e0e0;
        padding: 5px 10px;
        gap: 5px;
        overflow-x: auto;
      }
      
      .page-tab {
        padding: 5px 10px;
        background: #f5f5f5;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 14px;
      }
      
      .page-tab.active {
        background: white;
        font-weight: bold;
      }
      
      @media (max-width: 600px) {
        .toolbar {
          gap: 3px;
        }
        
        .toolbar button, 
        .toolbar select {
          padding: 6px 8px;
          font-size: 12px;
        }
        
        .page {
          padding: 15px;
          min-height: 300px;
        }
        
        .editor audio {
          min-width: 200px;
        }
        
        .page-tab {
          padding: 5px 8px;
          font-size: 12px;
        }
      }
  </style>
</head>
<body>
  <div class="editor-container">
    <!-- Onglets dyal  dok les pages -->
    <div class="page-tabs" id="pageTabs">
      <div class="page-tab active" data-page="page1">Page 1</div>
    </div>
    
    <!-- Toolbar fiha les boutons dyal mise en forme -->
    <div class="toolbar">
      <button id="bold" title="Bold"><i class="fas fa-bold"></i></button>
      <button id="italic" title="Italic"><i class="fas fa-italic"></i></button> 
      <button id="underline" title="Underline"><i class="fas fa-underline"></i></button> 
      <input type="color" id="textColor" title="Text Color" value="#000000"> <!-- color picker -->
      <select id="fontFamily"> 
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
        <option value="Georgia">Georgia</option>
      </select>
      <select id="fontSize"> 
        <option value="1">Small</option>
        <option value="3" selected>Normal</option>
        <option value="5">Large</option>
        <option value="7">Huge</option>
      </select>
      <button id="alignLeft" title="Align Left"><i class="fas fa-align-left"></i></button> 
      <button id="alignCenter" title="Align Center"><i class="fas fa-align-center"></i></button> 
      <button id="alignRight" title="Align Right"><i class="fas fa-align-right"></i></button> 
      <button id="addPage"><i class="fas fa-plus"></i> new page</button> 
      <button id="deletePage"><i class="fas fa-trash"></i> Delete Page</button> 
    </div>
    
    <!-- Conteneur dyal les pages -->
    <div id="pages">
      <div class="page active" id="page1">
        <div id="editor1" class="editor" contenteditable="true">bda tektb </div> <!-- zone d'édition -->
      </div>
    </div>
    
    <!-- Options dyal fichier -->
    <div class="file-options">
      <button id="saveBtn"><i class="fas fa-save"></i> Save as TXT</button> <!-- sauvegarder fichier -->
      <button id="openBtn"><i class="fas fa-folder-open"></i> Open File</button> <!-- ouvrir fichier -->
    </div>
  </div>
  
  <script src="lcodeFINALdyal_textEDITOR.js"></script>
</body><div class="333"></div>
</html>
